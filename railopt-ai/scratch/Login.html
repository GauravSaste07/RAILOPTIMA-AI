<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RailOpt AI - Access Control</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Public+Sans:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#dce4e5",
                        "secondary-fixed": "#b3ecf7",
                        "tertiary-fixed-dim": "#f3bf26",
                        "surface-dim": "#0d1516",
                        "on-secondary-fixed-variant": "#0d4e57",
                        "on-primary-fixed": "#001f24",
                        "on-primary": "#00363d",
                        "surface-container-low": "#151d1e",
                        "error": "#ffb4ab",
                        "primary-fixed-dim": "#00daf3",
                        "on-tertiary": "#3e2e00",
                        "on-secondary-fixed": "#001f24",
                        "secondary-container": "#11505a",
                        "on-secondary-container": "#8ac1cc",
                        "surface-tint": "#00daf3",
                        "surface-container-lowest": "#080f11",
                        "on-error": "#690005",
                        "on-secondary": "#00363d",
                        "surface-container-high": "#242b2d",
                        "primary": "#c3f5ff",
                        "on-tertiary-container": "#6f5500",
                        "error-container": "#93000a",
                        "on-primary-fixed-variant": "#004f58",
                        "tertiary-container": "#fec931",
                        "primary-container": "#00e5ff",
                        "surface-bright": "#333a3c",
                        "background": "#0d1516",
                        "on-tertiary-fixed-variant": "#594400",
                        "on-background": "#dce4e5",
                        "on-surface-variant": "#bac9cc",
                        "outline-variant": "#3b494c",
                        "surface-container-highest": "#2e3638",
                        "secondary-fixed-dim": "#98d0da",
                        "on-tertiary-fixed": "#251a00",
                        "on-error-container": "#ffdad6",
                        "secondary": "#98d0da",
                        "outline": "#849396",
                        "on-primary-container": "#00626e",
                        "tertiary-fixed": "#ffdf96",
                        "tertiary": "#ffeac0",
                        "surface-variant": "#2e3638",
                        "on-surface": "#dce4e5",
                        "inverse-on-surface": "#2a3233",
                        "surface": "#0d1516",
                        "primary-fixed": "#9cf0ff",
                        "surface-container": "#192122",
                        "inverse-primary": "#006875"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"],
                        "label": ["Public Sans", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        .grid-bg {
            background-image: 
                linear-gradient(to right, rgba(59, 73, 76, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(59, 73, 76, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .glow-btn {
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            transition: all 0.3s ease;
        }
        .glow-btn:hover {
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.6);
            transform: translateY(-1px);
        }
        .glass-card {
            background: rgba(21, 29, 30, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 73, 76, 0.4);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col relative overflow-hidden">
<!-- Background Pattern -->
<div class="absolute inset-0 grid-bg pointer-events-none z-0"></div>
<!-- Subtle Radial Gradient Overlay for focus -->
<div class="absolute inset-0 bg-radial-gradient from-transparent via-background/80 to-background z-0 pointer-events-none" style="background: radial-gradient(circle at center, transparent 0%, #0d1516 80%);"></div>
<!-- Header (Simplified for Login) -->
<header class="w-full p-6 flex justify-between items-center z-10 relative">
<div class="flex items-center gap-3">
<!-- Simulated Indian Railways Logo Mark -->
<div class="w-10 h-10 rounded-full border-2 border-primary-container flex items-center justify-center bg-surface-container-low shadow-[0_0_10px_rgba(0,229,255,0.3)]">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">train</span>
</div>
<div class="flex flex-col">
<h1 class="text-xl font-headline font-bold text-primary-container tracking-tight leading-tight">RailOpt AI</h1>
<span class="font-mono text-[10px] text-secondary-fixed-dim uppercase tracking-widest">Operations Command</span>
</div>
</div>
<div class="hidden sm:flex items-center gap-2">
<span class="relative flex h-3 w-3">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary-container opacity-75"></span>
<span class="relative inline-flex rounded-full h-3 w-3 bg-primary-container"></span>
</span>
<span class="font-mono text-xs text-on-surface-variant">SYSTEM ONLINE</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center p-4 z-10 relative">
<div class="w-full max-w-md">
<!-- Auth Card -->
<div class="glass-card rounded-xl shadow-2xl p-8 relative overflow-hidden">
<!-- Decorative top line -->
<div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-50"></div>
<!-- Tabs -->
<div class="flex border-b border-outline-variant mb-8">
<button class="flex-1 pb-3 text-center font-headline font-bold text-primary-container border-b-2 border-primary-container transition-colors focus:outline-none">
                        Sign In
                    </button>
<button class="flex-1 pb-3 text-center font-headline font-medium text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none">
                        Create Account
                    </button>
</div>
<!-- Form -->
<form class="space-y-6">
<div>
<label class="block font-mono text-xs text-on-surface-variant mb-2" for="identifier">Email or Staff ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">badge</span>
<input class="w-full bg-surface-container-high border border-outline-variant rounded-lg py-3 pl-10 pr-4 text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all font-mono text-sm placeholder:text-outline/50 outline-none" id="identifier" placeholder="e.g., EMP-49201" type="text"/>
</div>
</div>
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-mono text-xs text-on-surface-variant" for="password">Password</label>
<a class="font-mono text-xs text-secondary-fixed-dim hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-surface-container-high border border-outline-variant rounded-lg py-3 pl-10 pr-4 text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all font-mono text-sm placeholder:text-outline/50 outline-none" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="pt-4 space-y-4">
<button class="w-full bg-primary-container text-on-primary-container font-headline font-bold rounded-lg py-3 flex items-center justify-center gap-2 glow-btn" type="button">
<span class="material-symbols-outlined">login</span>
                            Enter Control Center
                        </button>
<button class="w-full bg-transparent border border-outline-variant text-on-surface hover:bg-surface-container-highest hover:border-outline font-headline font-medium rounded-lg py-3 transition-all flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined">group</span>
                            Guest Access
                        </button>
</div>
</form>
<!-- Status indicator -->
<div class="mt-8 pt-4 border-t border-outline-variant/50 flex justify-between items-center">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-outline">shield_lock</span>
<span class="font-mono text-[10px] text-outline">256-BIT ENCRYPTION</span>
</div>
<span class="font-mono text-[10px] text-outline">NODE: IR-DEL-01</span>
</div>
</div>
</div>
</main>
<!-- Footer Component based on JSON -->
<footer class="bg-surface-container-lowest border-t border-outline-variant flex justify-between items-center px-8 py-3 w-full z-10 relative">
<p class="text-outline font-label text-[10px] uppercase tracking-widest">
            © 2024 RailOpt AI Operations. Classified Indian Railways Personnel Only.
        </p>
<div class="flex gap-4">
<a class="text-outline hover:text-tertiary-fixed transition-colors font-label text-[10px] uppercase tracking-widest" href="#">Terms of Service</a>
<a class="text-outline hover:text-tertiary-fixed transition-colors font-label text-[10px] uppercase tracking-widest" href="#">Privacy Policy</a>
<a class="text-outline hover:text-tertiary-fixed transition-colors font-label text-[10px] uppercase tracking-widest" href="#">Security Protocol</a>
</div>
</footer>
</body></html>
